<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="以 MOF 与 AI 为核心的研究图谱，连接化学材料、实验机器人、数学基础、生命科学与交互式论文讲解。">
  <title>研究图谱 · Kewei Zhu</title>
  <style>
    :root {
      --ink: #f4f7fb;
      --muted: #a8b4c7;
      --line: rgba(255,255,255,.13);
      --panel: rgba(14, 23, 42, .73);
      --bg: #07111f;
      --cyan: #7de3ff;
      --lime: #d7f26b;
      --orange: #ffb66e;
      --pink: #f4a6d7;
      --violet: #b9a6ff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(67, 177, 255, .16), transparent 28rem),
        radial-gradient(circle at 85% 20%, rgba(215, 242, 107, .11), transparent 25rem),
        linear-gradient(145deg, #07111f 0%, #0a1528 58%, #101326 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 28px 0; }
    .brand { display: flex; gap: 12px; align-items: center; text-decoration: none; }
    .mark { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(125,227,255,.25), rgba(215,242,107,.15)); font-weight: 800; }
    .brand strong { letter-spacing: .02em; }
    .brand span, .eyebrow, .meta { color: var(--muted); font-size: .78rem; letter-spacing: .13em; text-transform: uppercase; }
    .header-actions { display: flex; align-items: center; gap: 18px; }
    nav { display: flex; gap: 18px; color: var(--muted); font-size: .9rem; }
    nav a { text-decoration: none; }
    nav a:hover { color: var(--ink); }
    .lang-toggle { flex: 0 0 auto; white-space: nowrap; padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.06); color: var(--ink); font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; }
    .lang-toggle:hover { background: rgba(255,255,255,.12); }
    .lang-toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .hero { padding: 92px 0 76px; max-width: 850px; }
    .eyebrow { color: var(--cyan); margin-bottom: 20px; }
    h1 { margin: 0; max-width: 840px; font-size: clamp(3rem, 8vw, 6.7rem); line-height: .95; letter-spacing: -.075em; font-weight: 700; }
    html[lang="zh-CN"] h1 { line-height: 1.12; letter-spacing: -.02em; }
    .hero p { max-width: 670px; margin: 28px 0 0; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.34rem); line-height: 1.65; }
    .hero strong { color: var(--ink); font-weight: 600; }
    .section-head { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin: 12px 0 22px; }
    h2 { margin: 0; font-size: clamp(1.7rem, 3vw, 2.4rem); letter-spacing: -.04em; }
    .section-head p { color: var(--muted); margin: 0; max-width: 440px; line-height: 1.55; }
    .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card {
      position: relative; min-height: 390px; padding: 26px; border: 1px solid var(--line);
      border-radius: 24px; background: linear-gradient(155deg, rgba(255,255,255,.10), var(--panel));
      overflow: hidden; display: flex; flex-direction: column; transition: transform .25s ease, border-color .25s ease;
    }
    .card:hover { transform: translateY(-7px); border-color: rgba(255,255,255,.35); }
    .card::after { content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%; right: -65px; top: -65px; opacity: .18; filter: blur(2px); }
    .ai::after { background: var(--cyan); }
    .mof::after { background: var(--lime); }
    .robotics::after { background: var(--orange); }
    .chem::after { background: var(--cyan); }
    .bio::after { background: var(--pink); }
    .math::after { background: var(--violet); }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .index { font-size: 3rem; font-weight: 750; letter-spacing: -.09em; color: rgba(255,255,255,.2); }
    .pill { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
    .card h3 { margin: 50px 0 10px; font-size: 1.65rem; letter-spacing: -.04em; }
    .card h3 span { display: block; margin-top: 6px; color: var(--muted); font-size: .98rem; font-weight: 450; letter-spacing: 0; }
    .card p { color: var(--muted); line-height: 1.6; margin: 0; }
    .card-link { margin-top: auto; padding-top: 26px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; font-weight: 650; }
    .card-link b { font-size: 1.3rem; transition: transform .2s ease; }
    .card-link:hover b { transform: translateX(5px); }
    .ai .card-link { color: var(--cyan); }
    .mof .card-link { color: var(--lime); }
    .robotics .card-link { color: var(--orange); }
    .chem .card-link { color: var(--cyan); }
    .bio .card-link { color: var(--pink); }
    .math .card-link { color: var(--violet); }
    main { padding-bottom: 86px; }
    .recent { margin: 86px 0 0; padding: 25px 28px; border: 1px solid var(--line); border-radius: 22px; background: rgba(255,255,255,.055); }
    .recent[hidden] { display: none; }
    .recent .eyebrow { margin-bottom: 0; }
    .recent h3 { margin: 7px 0 10px; font-size: 1.3rem; }
    .recent-item { display: flex; align-items: center; justify-content: space-between; gap: 25px; padding: 14px 0; border-top: 1px solid rgba(255,255,255,.08); }
    .recent-item h4 { margin: 0 0 4px; font-size: 1rem; line-height: 1.4; }
    .recent-meta { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.5; }
    .recent-meta b { color: var(--cyan); font-weight: 650; }
    .button { display: inline-flex; align-items: center; gap: 9px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; white-space: nowrap; }
    .button:hover { background: rgba(255,255,255,.1); }
    footer { display: flex; justify-content: space-between; gap: 18px; padding: 28px 0 42px; color: var(--muted); font-size: .86rem; border-top: 1px solid var(--line); }
    footer a { color: var(--ink); text-decoration: none; }
    .catalog-tools { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin: 28px 0 16px; }
    .search-box { display:flex; align-items:center; gap:10px; flex:1; max-width:520px; padding:12px 15px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.06); color:var(--muted); }
    .search-box input { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; }
    .search-box input::placeholder { color:var(--muted); }
    .explainer-filter { display:inline-flex; align-items:center; gap:8px; min-height:44px; color:var(--ink); font-size:.86rem; cursor:pointer; }
    .explainer-filter input { width:17px; height:17px; margin:0; accent-color:var(--cyan); }
    .explainer-filter input:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
    .catalog-status { color:var(--muted); font-size:.82rem; }
    .clear-search { min-height:36px; padding:6px 11px; border:1px solid var(--line); border-radius:9px; background:transparent; color:var(--cyan); font:inherit; font-size:.82rem; cursor:pointer; }
    .clear-search:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
    .catalog { display:grid; gap:12px; }
    .theme-menu { border:1px solid var(--line); border-radius:22px; background:rgba(255,255,255,.045); overflow:hidden; }
    .theme-menu[open] { background:rgba(255,255,255,.075); }
    .theme-menu.no-match { opacity:.45; }
    .theme-menu summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:72px 1fr auto 28px; align-items:center; gap:18px; padding:22px 24px; }
    .theme-menu summary::-webkit-details-marker { display:none; }
    .theme-number { font-size:2.4rem; font-weight:750; color:rgba(255,255,255,.2); letter-spacing:-.08em; }
    .theme-name { font-size:1.35rem; font-weight:700; letter-spacing:-.03em; }
    .theme-name small { display:block; margin-top:4px; color:var(--muted); font-size:.9rem; font-weight:450; letter-spacing:0; }
    .theme-count { color:var(--muted); font-size:.8rem; white-space:nowrap; }
    .chevron { color:var(--muted); font-size:1.35rem; text-align:center; }
    .theme-menu[open] .chevron { transform:rotate(45deg); }
    .theme-body { padding:0 24px 24px; }
    .theme-search { display:flex; justify-content:flex-end; margin-bottom:14px; }
    .theme-search input { width:min(360px,100%); padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:rgba(0,0,0,.12); color:var(--ink); outline:0; }
    .paper-group { border-top:1px solid var(--line); margin-top:12px; }
    .group-toggle { width:100%; border:0; padding:16px 0 12px; display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--muted); background:transparent; cursor:pointer; text-align:left; font:inherit; }
    .group-toggle:focus-visible { outline:2px solid var(--cyan); outline-offset:4px; border-radius:4px; }
    .group-title { font-size:.78rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
    .group-chevron { flex:0 0 auto; color:var(--muted); font-size:1.1rem; line-height:1; }
    .group-toggle[aria-expanded="true"] .group-chevron { color:var(--cyan); }
    .group-content[hidden] { display:none !important; }
    .category-menu > .group-toggle .group-title { font-size:1rem; color:var(--ink); letter-spacing:0; text-transform:none; }
    .category-menu > .group-content { padding:0 0 8px 18px; border-left:2px solid var(--line); }
    .topic-menu > .group-toggle { min-height:48px; }
    .group-toggle { touch-action:manipulation; }
    .group-chevron { min-width:28px; text-align:center; }
    :is(.paper-row, .document-row) { display:grid; grid-template-columns:minmax(120px,.25fr) minmax(240px,1fr) minmax(120px,.8fr) auto; gap:16px; align-items:center; padding:14px 0; border-top:1px solid rgba(255,255,255,.08); }
    :is(.paper-row, .document-row):first-of-type { border-top:0; }
    .paper-key { color:var(--cyan); font-size:.78rem; font-weight:700; }
    .paper-title { margin:0; font-size:.95rem; line-height:1.4; }
    .paper-summary { margin:8px 0; color:#c4cfde; font-size:.88rem; font-weight:400; line-height:1.75; overflow-wrap:anywhere; }
    .paper-meta { margin:3px 0 0; color:var(--muted); font-size:.78rem; line-height:1.4; }
    .paper-also { margin:6px 0 0; color:var(--muted); font-size:.76rem; line-height:1.55; }
    .paper-also b { color:var(--cyan); font-weight:600; }
    .paper-info { color:var(--muted); font-size:.78rem; line-height:1.45; }
    .paper-actions { display:flex; gap:8px; justify-content:flex-end; align-items:center; white-space:nowrap; }
    .paper-actions a { color:var(--ink); text-decoration:none; font-size:.78rem; }
    .paper-actions a:hover { color:var(--cyan); }
    .paper-actions .status { color:var(--muted); font-size:.72rem; }
    .empty-state { padding:20px 0; color:var(--muted); font-size:.9rem; }

    @media (max-width: 800px) {
      .themes { grid-template-columns: 1fr; }
      .catalog-tools { align-items:stretch; flex-direction:column; }
      .search-box { max-width:none; }
      .theme-menu summary { grid-template-columns:52px 1fr 24px; gap:12px; padding:18px; }
      .theme-count { grid-column:2; grid-row:2; }
      .chevron { grid-column:3; grid-row:1 / span 2; }
      .theme-body { padding:0 18px 18px; }
      :is(.paper-row, .document-row) { grid-template-columns:1fr; gap:7px; }
      .paper-actions { justify-content:flex-start; }

      .hero { padding-top: 60px; }
      .section-head, .recent-item, footer { align-items: flex-start; flex-direction: column; }
      .recent-item .button { width: 100%; justify-content: center; }
      nav { display: none; }
    }

    .related-papers p { color:var(--muted); line-height:1.65; }
    .related-papers ul { padding-left:20px; line-height:1.9; }
    .related-papers small { color:var(--muted); }
    .paper-ref { color:var(--cyan); text-underline-offset:3px; overflow-wrap:anywhere; }
    .tag-filters summary,.related-papers summary { cursor:pointer; min-height:44px; padding:12px 0; }
    .theme-filter { display:flex; align-items:center; gap:8px; font-size:.85rem; }
    .theme-filter select { color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:10px; max-width:100%; font:inherit; }
    .tag-filters { border-top:1px solid var(--line); margin-bottom:18px; }
    #tag-options { display:flex; flex-wrap:wrap; gap:18px; padding:10px 0 18px; }
    #tag-options fieldset { border:0; margin:0; padding:0; min-width:0; flex:1 1 220px; }
    #tag-options legend { color:var(--muted); font-size:.8rem; margin-bottom:8px; }
    #tag-options label { display:flex; align-items:center; gap:8px; min-height:36px; font-size:.85rem; }
    #tag-options input { accent-color:var(--cyan); }
    .paper-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
    .paper-tags button { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font:inherit; font-size:.73rem; cursor:pointer; }
    .paper-tags button[aria-pressed="true"] { color:var(--cyan); border-color:var(--cyan); }
    .theme-description { color:var(--muted); font-size:.9rem; line-height:1.6; }
    .related-papers { border-top:1px solid var(--line); margin-top:18px; }
    .related-papers[hidden] { display:none; }
    :is(a,button,input,select,summary):focus-visible { outline:2px solid var(--cyan); outline-offset:4px; }
    @media(max-width:800px) { .theme-filter { flex-wrap:wrap; } .theme-filter select { width:100%; } .hero { padding:42px 0 50px; } }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  </style>
<link rel="stylesheet" href="./assets/bibliography.css">
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="./">
        <span class="mark">KZ</span>
        <span><strong>Research Atlas</strong><br><span data-i18n="brandSub">Kewei Zhu · 可视化研究笔记</span></span>
      </a>
      <div class="header-actions">
        <nav data-i18n-aria="navAria" aria-label="主导航">
          <a href="#themes" data-i18n="navThemes">主题</a>
          <a href="./papers/" data-i18n="navExplainers">论文讲解</a>
          <a href="https://github.com/vickie02736/paper-webpages">GitHub ↗</a>
        </nav>
        <button id="lang-toggle" class="lang-toggle" type="button" aria-pressed="false" aria-label="Switch to English">EN</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow" data-i18n="heroEyebrow">研究的可视化索引</div>
        <h1 data-i18n-html="heroTitle">MOF + AI，<br>连接下一步。</h1>
        <p data-i18n-html="heroText">以<strong>金属有机框架与人工智能</strong>为核心的灵感库：连接高通量筛选、机器学习势与自动实验，从数学基础和兄弟领域积累问题、方法与判断。</p>
      </section>

      <section id="themes" aria-labelledby="themes-title">
        <div class="section-head">
          <div>
            <div class="eyebrow" data-i18n="catalogEyebrow">研究目录</div>
            <h2 id="themes-title" data-i18n="catalogTitle">探索六个主题</h2>
          </div>
          <p data-i18n="catalogText">展开主分类浏览论文。可按标题、作者、单位、方法、子方向、会议或年份搜索，多个词不分先后；主题内搜索会在此基础上进一步筛选。</p>
        </div>
        <div class="catalog-tools">
          <label class="search-box"><span>⌕</span><input id="catalog-search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchAria" placeholder="搜索论文、作者或单位，例如 MIT 或 蛋白设计" aria-label="搜索全部论文"></label>
          <label class="explainer-filter"><input id="only-explainers" type="checkbox" disabled><span data-i18n="onlyExplainers">仅显示已有讲解</span></label>
          <label class="theme-filter"><span data-i18n="themeFilter">主分类</span><select id="theme-filter"><option value="" data-i18n="allThemes">全部主分类</option></select></label>
          <span id="catalog-status" class="catalog-status" data-i18n="loading" role="status">正在加载论文目录…</span>
          <button id="clear-search" class="clear-search" type="button" data-i18n="clearSearch" hidden>清除搜索</button>
        </div>
        <details class="tag-filters"><summary id="tag-filter-label" data-i18n="tagFilters">跨学科标签</summary><div id="tag-options"></div></details>
        <div id="catalog" class="catalog" aria-live="polite">

        </div>
      </section>

      <section id="recent" class="recent" aria-labelledby="recent-title" hidden>
        <div class="eyebrow" data-i18n="recentEyebrow">近一周的讲解页</div>
        <h3 id="recent-title" data-i18n="recentTitle">最近新增的交互式讲解</h3>
        <div id="recent-list"></div>
      </section>
    </main>

    <footer>
      <span data-i18n="footerText">为慢读、清晰的问题与更好的联系而建。</span>
      <a href="https://github.com/vickie02736/paper-webpages" data-i18n="footerLink">查看仓库 ↗</a>
    </footer>
  </div>
  <script src="./assets/bibliography.js"></script>
<script src="./assets/catalog.js?v=3"></script>
</body>
</html>
