<div class="lab"><div class="lab-head"><div><span class="tag orange">${pair(P('教学计算 · 不是论文新数据','TEACHING CALCULATION · NOT NEW PAPER DATA'))}</span><h3>${pair(P('同一个 SF，可以得到不同的纯度和回收率','The same SF allows different purity and recovery'))}</h3></div><button id="reset-lab">${pair(P('重置','Reset'))}</button></div><div class="lab-grid"><div><label class="range-label" for="heavy-range"><span id="heavy-label"></span><output id="heavy-output" for="heavy-range"></output></label><input id="heavy-range" type="range" min="0.1" max="99" step="0.1" value="1"><p class="small muted">${pair(P('假设初始两种离子摩尔数相等、体系封闭，且 SF 恒定。指定重离子进入固相的比例，再由相分配关系计算另外几项。纯度仅在这两种稀土之间计算，不计框架与溶剂。','Assume equal initial moles, a closed system and constant SF. Choose the fraction of the heavy ion adsorbed, then calculate the phase balance. Purity is calculated among these two REEs only, excluding the framework and solvent.'))}</p></div><div><div class="results" aria-live="polite"><div class="result"><output class="value" id="light-recovery"></output><div class="name" id="recovery-label"></div><div class="phase"><span class="light" id="recovery-bar"></span></div></div><div class="result"><output class="value" id="solid-purity"></output><div class="name" id="solid-label"></div><div class="phase"><span class="light" id="solid-light"></span><span class="heavy" id="solid-heavy"></span></div></div><div class="result"><output class="value" id="liquid-purity"></output><div class="name" id="liquid-label"></div><div class="phase"><span class="light" id="liquid-light"></span><span class="heavy" id="liquid-heavy"></span></div></div></div><div class="legend"><span><i class="dot"></i><span id="light-legend"></span></span><span><i class="dot heavy"></i><span id="heavy-legend"></span></span></div><p class="source">${pair(P('无量纲摩尔分数计算；忽略饱和、剂量、竞争变化与溶液物种变化，不能预测真实实验操作点。','Dimensionless molar-fraction calculation. Saturation, dose, changing competition and speciation are omitted; this cannot predict an experimental operating point.') <details><summary>${pair(P('查看推导：为什么 SF 不能单独给出纯度？','See the derivation: why does SF alone not fix purity?'))}</summary><div class="inside"><div class="formula">K<sub>d,i</sub> = [(C₀,i − Cₑ,i) / Cₑ,i] · V/m</div><div class="formula">α = SF = K<sub>d,L</sub>/K<sub>d,H</sub> = [r<sub>L</sub>/(1−r<sub>L</sub>)] / [r<sub>H</sub>/(1−r<sub>H</sub>)]</div><div class="formula">r<sub>L</sub> = αr<sub>H</sub> / (1−r<sub>H</sub>+αr<sub>H</sub>)</div><p>${pair(P('r 是该离子被吸附的摩尔比例，L/H 是本组较轻／较重离子。相同的 V/m 在比值中抵消；Kd 的单位为 mL/g 时 V 取 mL。等摩尔进料下，固相 L 纯度 = rᴸ/(rᴸ+rᴴ)，滤液 H 纯度 = (1−rᴴ)/(2−rᴸ−rᴴ)。这些是由质量守恒推导的教学式，非论文拟合模型。','r is the adsorbed mole fraction of that ion; L/H denote the lighter/heavier member of the pair. The common V/m cancels in the ratio; use V in mL for Kd in mL/g. For equimolar feeds, solid L purity = rᴸ/(rᴸ+rᴴ), and filtrate H purity = (1−rᴴ)/(2−rᴸ−rᴴ). These teaching equations follow mass balance; they are not fitted models from the paper.'))}</p></div></details></div>${source('来源：正文 p. 5–6、图 6；SI p. 5 / Eq. 7–9。滑块部分为讲解者推导。','Sources: main pp. 5–6, Fig. 6; SI p. 5 / Eqs. 7–9. Slider calculations are derived for this explainer.')}</section>

<div class="limits"><div class="limit"><h3>${pair(P('01 相隔较远，不等于相邻可分','01 Distant pairs do not prove adjacent separation'))}</h3><p>${pair(P('六组模型均是选定的轻／重组合。高 SF 不能外推到每一对相邻镧系元素；下一步应测试相邻对、多离子竞争及目标产品回收。','All six models are selected light/heavy pairs. Their SF values do not establish separation of every adjacent lanthanide pair; adjacent pairs, multicomponent competition and product recovery need direct tests.'))}</p></div><div class="limit"><h3>${pair(P('02 静态能量，不等于水相自由能','02 Static energy is not aqueous free energy'))}</h3><p>${pair(P('DFT 使用孤立离子参照。溶剂化、脱水代价、熵和物种变化没有被完整的水相自由能循环覆盖，不能用能量差直接换算实验 SF。','DFT uses isolated-ion references. Solvation, dehydration, entropy and speciation are not captured by a full aqueous free-energy cycle; energy differences cannot be directly converted to experimental SF.'))}</p></div><div class="limit"><h3>${pair(P('03 保持衍射，不等于不溶出','03 Retained diffraction does not establish zero leaching'))}</h3><p>${pair(P('pH 2–13 浸泡 12 h 后的 PXRD 与四轮再生有支持价值，但需要更长期的 Zn／配体溶出、结构和选择性联动测试，才能判断实际服役稳定性。','PXRD after 12 h at pH 2–13 and four reuse cycles are useful evidence. Longer tests linking Zn/linker leaching, structure and selectivity are needed to assess service stability.'))}</p></div><div class="limit"><h3>${pair(P('04 一次吸附，不等于一步完成工艺','04 One adsorption step is not an entire flowsheet'))}</h3><p>${pair(P('测试仍涉及预过滤、调 pH、6 h 接触、固液分离与酸洗再生。放大需要考察流量、床层、收集窗口、纯度—回收率与药剂消耗。','The tests still involve prefiltration, pH adjustment, 6 h contact, phase separation and acid regeneration. Scale-up must examine flow, bed design, collection windows, purity–recovery trade-offs and reagent use.'))}</p></div></div>
<details><summary>${pair(P('与站内其他稀土研究怎样联系？','Connect this paper to other rare-earth studies'))}</summary><div class="inside"><p>${pair(P('NCU-1 关注结合口袋的几何与多点识别；Ln 局部配位页面关注实际吸附位点的结构证据；PMIDA–MIL-101 页面关注配体负载、吸附与再生。共同的问题是：怎样把“材料含有什么官能团”推进到“离子在哪里、以什么形态结合，以及怎样影响竞争分离”。','NCU-1 focuses on pocket geometry and multipoint recognition; the local-coordination page examines structural evidence for binding sites; PMIDA–MIL-101 explores ligand loading, adsorption and regeneration. Together they ask how to move from functional-group inventories to actual binding location, speciation and competitive separation.'))}</p><div class="footer-links"><a class="related-link" href="../ln-local-coordination/">${pair(P('Ln × MOF 局部配位 ↗','Ln × MOF local coordination ↗'))}</a><a class="related-link" href="../pmida-mil101/">PMIDA–MIL-101 ↗</a></div></div></details></section>

const steps=[
 [P('从 Zn 节点和两类配体开始','Start with Zn nodes and two linkers'),P('BTC（均苯三甲酸）与含三唑的 DTB 配体连接 Zn 节点，形成二维延展网络。矩形窗口约 9.9 × 5.8 Å。','BTC (trimesic acid) and triazole-containing DTB link Zn nodes into a two-dimensional extended network. Rectangular windows are about 9.9 × 5.8 Å.')],
 [P('互穿把空隙重新组织','Interpenetration reorganises the voids'),P('第二套网络与第一套互穿，产生更小的口袋。结构变化不仅是“孔变小”，也改变了可接近官能团的空间组合。','A second network interpenetrates the first, creating smaller pockets. This changes both the available space and the spatial arrangement of accessible functional groups.')],
 [P('小口袋里，布置多个相互作用点','Several potential contacts in one pocket'),P('作者提出：未配位羧基、三唑氮与水共同参与结合。图中虚线只表示可能的相互作用，不是实测的键长或固定配位数。','The authors propose participation of uncoordinated carboxyl groups, triazole N and water. Dashed contacts indicate possible interactions, not measured bond lengths or a fixed coordination number.')],
 [P('尺寸与配位匹配，带来亲和力差异','Geometric and chemical fit change affinity'),P('在作者选取的计算构型中，Pr 的静态吸附更有利。较小离子也可以进入和吸附；机制并不是一个把所有小离子排除在外的硬筛子。','For the configurations studied, static adsorption is more favourable for Pr. Smaller ions can also enter and adsorb; this is not a hard sieve that excludes every smaller ion.')]
];
const species={Pr:{r:29,color:'#ffb66e',energy:'−3.29',name:P('轻稀土','Light REE')},Dy:{r:24,color:'#b9a6ff',energy:'−2.58',name:P('重稀土','Heavy REE')},Al:{r:16,color:'#99b9ff',energy:'−1.66',name:P('竞争离子','Competing ion')}};
function updateMechanism(){
 document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.step===S.step));
 document.querySelectorAll('[data-species]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.species===S.species));
 document.getElementById('species-controls').hidden=S.step!==3;
 const sp=species[S.species];
 document.getElementById('step-copy').innerHTML=`<span class="tag">${pair(P('作者提出的机制','AUTHOR-PROPOSED MECHANISM'))}</span><h3 class="step-name">${pair(steps[S.step][0])}</h3><p>${pair(steps[S.step][1])}</p>${S.step===3?`<p class="small"><strong>${S.species}³⁺ · ${pair(sp.name)} · E<sub>ads</sub> = ${sp.energy} eV</strong><br>${pair(P('静态 DFT，孤立离子参照；不是水相自由能。','Static DFT, isolated-ion reference; not aqueous free energy.'))}</p>`:''}`;
 const grid=(off,color)=>`<g class="svg-edges" stroke="${color}" stroke-width="5" transform="translate(${off} ${off/2})"><path d="M85 75L205 48 350 92 350 240 225 278 85 235Z M85 152L225 194 350 163 M205 48V120L350 164 M225 194V278"/></g>`;
 const pocket=S.step>=2?`<circle cx="255" cy="175" r="67" fill="#07111f" stroke="var(--lime)" stroke-width="2"/><circle cx="255" cy="175" r="50" fill="none" stroke="var(--muted)" stroke-dasharray="4 5"/>${[[211,142,'O','#ffb66e'],[300,143,'O','#ffb66e'],[253,229,'N','#99b9ff']].map(([x,y,s,c])=>`<circle cx="${x}" cy="${y}" r="14" fill="${c}"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#07111f" font-size="13">${s}</text>`).join('')}`:'';
 const atom=S.step===3?`<path d="M219 149L255 175 292 150 M255 175V215" fill="none" stroke="${sp.color}" stroke-width="2" stroke-dasharray="5 5"/><circle class="atom" cx="255" cy="175" r="${sp.r}" fill="${sp.color}"/><text x="255" y="180" text-anchor="middle" fill="#07111f" font-size="14">${S.species}³⁺</text>`:'';
 const labels=[P('Zn / BTC / DTB · 二维网络','Zn / BTC / DTB · 2D network'),P('两套网络 · 双重互穿','Two networks · two-fold interpenetration'),P('结合口袋 ≈ 3.2 Å','Binding pocket ≈ 3.2 Å'),P('结合示意 · 不按尺寸比例','Binding schematic · not to scale')];
 document.getElementById('mechanism-svg').innerHTML=`<rect width="560" height="350" fill="var(--panel2)"/>${grid(0,'var(--cyan)')}${S.step>0?grid(42,'#d7f26b'):''}${pocket}${atom}<text x="280" y="327" text-anchor="middle" class="svg-label">${text(labels[S.step])}</text>${S.step===0?`<text x="280" y="305" text-anchor="middle" class="svg-small">${text(P('矩形窗口 9.9 × 5.8 Å · 正文值，示意不按比例','Windows 9.9 × 5.8 Å · reported; not to scale'))}</text>`:''}`;
 document.getElementById('mechanism-svg').setAttribute('aria-label',text(labels[S.step])+'; '+text(steps[S.step][0]));
}
function updateCapacity(){
 document.querySelectorAll('[data-capacity]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.capacity===S.capacity));
 const vals=capacities[S.capacity];
 document.getElementById('capacity-title').textContent=text(S.capacity==='si'?P('Langmuir 拟合最大容量 qₘ','Langmuir fitted maximum capacity qₘ'):P('正文报告的容量','Main-text reported capacities'));
 document.getElementById('capacity-chart').innerHTML=ions.map((x,i)=>`<div class="bar-row"><span>${x}</span><div class="bar-track"><div class="bar-fill" style="width:${vals[i]/5}%"></div></div><span class="bar-value">${vals[i]}</span></div>`).join('');
 document.getElementById('capacity-note').innerHTML=pair(S.capacity==='si'?P('来源：SI Table 3，p. 45；446 / 332 / 226 / 141 / 134 / 98 / 73 mg/g。线性刻度 0–500。','Source: SI Table 3, p. 45; 446 / 332 / 226 / 141 / 134 / 98 / 73 mg/g. Linear scale 0–500.'):P('来源：正文 p. 2；420 / 310 / 221 / 140 / 126 / 97 / 66 mg/g。与 SI 拟合表数值不一致；原文未交代差异原因。','Source: main p. 2; 420 / 310 / 221 / 140 / 126 / 97 / 66 mg/g. These differ from the SI fit table; the paper does not explain why.'));
}
function updateBinary(){
 const [L,H,alpha]=pairs[S.pair];
 document.getElementById('pair-select').value=S.pair;
 document.getElementById('sf-value').textContent=alpha;
 document.getElementById('sf-caption').textContent=`K${'d'}(${L}) / K${'d'}(${H})`;
 document.getElementById('index-value').textContent=(alpha/(1+alpha)*100).toFixed(2)+'%';
 document.getElementById('sf-chart').innerHTML=pairs.map(([l,h,a],i)=>`<div class="sf-row ${i===S.pair?'selected':''}"><span>${l}/${h}</span><div class="bar-track"><div class="bar-fill" style="width:${a/8}%"></div></div><span>${a}</span></div>`).join('');
 document.getElementById('heavy-label').textContent=text(P(`${H} 被吸附的比例`,`${H} fraction adsorbed`));
 document.getElementById('recovery-label').textContent=text(P(`${L} 回收到固相的比例`,`${L} recovery into solid`));
 document.getElementById('solid-label').textContent=text(P(`固相中 ${L} 摩尔纯度`,`${L} molar purity in solid`));
 document.getElementById('liquid-label').textContent=text(P(`滤液中 ${H} 摩尔纯度`,`${H} molar purity in filtrate`));
 document.getElementById('light-legend').textContent=L+' · '+text(P('本组较轻离子','lighter member'));
 document.getElementById('heavy-legend').textContent=H+' · '+text(P('本组较重离子','heavier member'));
 const h=S.heavy/100,l=alpha*h/(1-h+alpha*h),solid=l/(l+h),liquid=(1-h)/(2-l-h);
 document.getElementById('heavy-range').value=S.heavy;
 document.getElementById('heavy-output').textContent=S.heavy.toFixed(1)+'%';
 document.getElementById('heavy-range').setAttribute('aria-valuetext',S.heavy.toFixed(1)+'%');
 for(const [id,v] of [['light-recovery',l],['solid-purity',solid],['liquid-purity',liquid]])document.getElementById(id).textContent=(v*100).toFixed(1)+'%';
 for(const [id,v] of [['recovery-bar',l],['solid-light',solid],['solid-heavy',1-solid],['liquid-light',1-liquid],['liquid-heavy',liquid]])document.getElementById(id).style.width=(v*100)+'%';
}

 2:{size:[970,735],page:3,type:P('晶体结构与结构模型','CRYSTAL STRUCTURE AND MODELS'),title:P('怎样从网络得到小口袋？','How does the network create pockets?'),alt:P('原文图 2：Zn 配位、二维网络、双重互穿拓扑与 3.2 Å 小口袋','Original Fig. 2: Zn coordination, 2D network, two-fold interpenetration and 3.2 Å pockets'),notes:[P('a 看 Zn 的局部连接，b 看延展网络。不要把节点配位环境当成稀土吸附后的结构。','a shows local Zn coordination; b shows the extended network. The node structure is not the structure of an adsorbed REE.'),P('c 用两种颜色区分互穿的两套网络；d 中紫色球标示小口袋位置，并非真实负载的稀土离子。','c distinguishes the interpenetrated networks by colour; the purple spheres in d mark pockets, not actual adsorbed REE ions.'),P('3.2 Å 对应小口袋；矩形窗口的 9.9 × 5.8 Å 来自正文 p. 2。两种尺寸应分别理解。','The 3.2 Å label describes the pocket; the 9.9 × 5.8 Å windows are described on main p. 2. Keep these dimensions distinct.')]},
 3:{size:[1080,830],page:3,type:P('实验数据与等温线拟合','EXPERIMENTAL DATA AND ISOTHERM FITS'),title:P('四个面板，四个不同问题','Four panels, four different questions'),alt:P('原文图 3：吸附等温线、pH 对分配系数影响、尾矿捕获率与柱突破曲线','Original Fig. 3: isotherms, pH-dependent partition coefficients, tailings capture and column breakthrough'),notes:[P('a：横轴 Cₑ（mg/L），纵轴 qₑ（mg/g）。散点与拟合曲线回答容量问题；不能从两条曲线高度比直接读出二元 SF。','a: Cₑ (mg/L) versus qₑ (mg/g). Data and fits address capacity, not a binary SF obtained by dividing curve heights.'),P('b：不同 pH 下的 Kd（mL/g）。与图 6 的二元浓度条件不同，不能混用 Kd 比值。','b: Kd (mL/g) at different pH. Its mixed-ion conditions differ from Fig. 6, so the Kd ratios are not interchangeable.'),P('c 为真实尾矿批量捕获百分比；d 为出液 C/C₀ 对床体积。较晚穿透表示更强保留，产品仍取决于收集区间。误差棒为 S.D.，n = 3。','c shows batch tailings capture; d plots effluent C/C₀ against bed volumes. Later breakthrough means greater retention; product composition depends on collection windows. Error bars: S.D., n = 3.')]},
