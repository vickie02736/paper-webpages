];

   g+=label((mx+lx)/2,286,P(`${ln}···${paa?'P':metal} 散射近邻`,`${ln}···${paa?'P':metal} scattering neighbor`),'#7de3ff',14);
 }
 if(paa){
   g+=fixed(213,195,'Ar–NH–C(=O)–CH₂','#d6dce8',18,'end');

 P('三项贡献：解析 Cr/Zr 氧簇上的内层配位；区分氨基的间接作用与 PAA 的位点转移；检验缺陷与孔径如何影响局部环境。','Three contributions: resolve inner-sphere binding at Cr/Zr oxo clusters; distinguish indirect amino effects from PAA-driven site transfer; examine defect and pore-size effects on local environments.'),

function mechanismText(){const m=mats[S.mat],paa=S.mat===5;
const all=[
 [P('水中的 Ln³⁺ 由水分子包围。','Ln³⁺ in water is surrounded by water molecules.'),P('输入：水相 Ln；操作：建立水合离子的参考图像；目的：区分仅靠近表面与直接配位；输出：水合态；连接：下一步的可用表面位点。','Input: aqueous Ln. Operation: establish a hydrated-ion reference. Purpose: distinguish surface proximity from direct coordination. Output: hydrated state. Next: an available surface site.'),P('图中水分子只是提示。DFT 模型使用六配位环境，并不意味着实验中每个 Ln 都是六配位。','The illustrated waters are reminders. The six-coordinate DFT environment does not mean that all experimentally adsorbed Ln are six-coordinate.')],
 [P(paa?'接入 PAA 后，多了一组可竞争的膦酸氧位点。':'金属氧簇提供含氧位点；氨基化不自动意味着 Ln–N 结合。',paa?'Installing PAA adds competing phosphonate oxygen donors.':'Metal oxo clusters supply oxygen sites; amination does not automatically imply Ln–N binding.'),P('输入：水合 Ln 与材料位点；操作：考虑可接近的 O 供体；目的：确定候选结合位置；输出：节点或官能团候选；连接：局部配位。','Input: hydrated Ln and material sites. Operation: consider accessible O donors. Purpose: identify candidate binding locations. Output: node or functional-group candidates. Next: local coordination.'),P('缺失连接体有利于暴露节点位点，但 §3.6 同时保留了 Ln 诱导 Zr–BDC 水解这一替代解释。图中过程不是测得的动力学轨迹。','Missing linkers can expose node sites, while §3.6 retains Ln-induced Zr–BDC hydrolysis as an alternative explanation. This is not a measured kinetic trajectory.')],
 [P(paa?(S.ln==='Gd'?'Gd–PAA 的实测证据支持膦酸氧结合；图示一种单齿候选。':`${S.ln}–O–P 是教学延伸；本文未报告这组局部结构。`):'Ln 与簇上 O 形成直接联系，可产生单齿或双齿的内层配合物。',paa?(S.ln==='Gd'?'Measured Gd–PAA evidence supports phosphonate oxygen binding; one monodentate candidate is shown.':`${S.ln}–O–P is a teaching extrapolation; this local structure was not reported.`):'Ln forms direct contacts with cluster oxygen, allowing mono- or bidentate inner-sphere complexes.'),P('输入：候选位点；操作：形成共享 O 的局部结构；目的：解释化学吸附；输出：Ln 周围的近邻环境；连接：XAFS 散射路径。','Input: candidate sites. Operation: form local structures with shared O. Purpose: explain chemisorption. Output: the local environment around Ln. Next: XAFS scattering paths.'),P('绿线表示直接 Ln–O 配位；虚线表示用于推断结构的 Ln···Cr/Zr/P 近邻关系，不代表直接金属–金属键。','Green lines denote direct Ln–O coordination; dashed lines indicate Ln···Cr/Zr/P neighbor relations used in structural inference, not direct metal–metal bonds.')],
 [P(paa?(S.ln==='Gd'?'Gd–P 路径支持膦酸基结合；较弱 Gd–Zr 路径说明节点结合仍可存在。':`虚线指向候选 ${S.ln}···P 近邻；实测的 Gd–P 证据不能直接移用于 ${S.ln}。`):'Ln–Cr/Zr 近邻路径支持氧簇位点；只有第一层 O 还不足以认定具体位置。',paa?(S.ln==='Gd'?'Gd–P paths support phosphonate binding; a weaker Gd–Zr path leaves residual node binding possible.':`The dashed path marks a candidate ${S.ln}···P neighbor; measured Gd–P evidence cannot be assigned directly to ${S.ln}.`):'Ln–Cr/Zr neighbor paths support oxo-cluster binding; first-shell O alone cannot establish the specific site.'),P('输入：湿样与理论散射路径；操作：拟合第一层与外层；目的：用元素身份和距离区分候选结构；输出：带不确定度的配位模型；连接：下方证据表。','Input: wet samples and theoretical scattering paths. Operation: fit first and outer shells. Purpose: distinguish candidates using neighbor identity and distance. Output: coordination models with uncertainty. Next: the evidence table below.'),P('XAFS 是系综平均。路径强度还受配位数、无序、振幅因子等影响；不同几何可能产生相近距离。','XAFS is an ensemble average. Path amplitudes depend on coordination number, disorder and amplitude factors; different geometries can yield similar distances.')]

const topologies=[

function topologySVG(i){let g='',nodes=[];if(i===0){g=bond(70,75,145,75)+bond(145,75,220,75,'new');nodes=[[70,75,24,'M','#6fe0d0'],[145,75,16,'O','#ff8585'],[220,75,24,'Ln','#d4ef8a']];}else if(i===1){g=bond(65,75,145,35)+bond(65,75,145,115)+bond(145,35,225,75,'new')+bond(145,115,225,75,'new');nodes=[[65,75,24,'M','#6fe0d0'],[145,35,16,'O','#ff8585'],[145,115,16,'O','#ff8585'],[225,75,24,'Ln','#d4ef8a']];}else{const z=i===2?35:15,oy=i===2?25:52;g=bond(65,30,150-z,oy)+bond(65,120,150-z,150-oy)+bond(150-z,oy,230,75,'new')+bond(150-z,150-oy,230,75,'new');nodes=[[65,30,23,'M','#6fe0d0'],[65,120,23,'M','#6fe0d0'],[150-z,oy,12,'O','#ff8585'],[150-z,150-oy,12,'O','#ff8585'],[230,75,24,'Ln','#d4ef8a']];}return `<svg viewBox="0 0 290 155" aria-hidden="true">${g+nodes.map(n=>atom(...n)).join('')}</svg>`}
function geometry(){return section(3,`<div class="grid4 topology">${topologies.map((v,i)=>`<div class="card" style="padding:10px">${topologySVG(i)}${button(v[0],`data-topo="${i}" aria-pressed="${S.topo===i}"`)}</div>`).join('')}</div><div class="card" aria-live="polite"><h3>${T(topologies[S.topo][0])}</h3><p>${T(topologies[S.topo][1])}</p><p class="small muted">${T(P('M 表示 Cr 或 Zr；O 表示与 Ln 直接接触的表面供体氧。四幅分别对应 Figures 4–5 的 A–D 候选局部拓扑；图不按键长或角度绘制，也不是完整氧簇或晶体坐标。PAA 的膦酸基只有一个 P 中心，本文提出的是单齿与双齿共享边构型，不把这四幅全部套用到 PAA。','M denotes Cr or Zr; O denotes the surface donor oxygen directly contacting Ln. The four panels map to candidate local topologies A–D in Figures 4–5; they are not drawn to bond-length or angle scale and do not reproduce a complete oxo cluster or crystal coordinates. A PAA phosphonate group has one P center: the paper proposes mono- and bidentate edge-sharing modes, rather than all four motifs.'))}</p></div>${note(pairDepth([
 P('“齿数”数的是 Ln 接触的表面 O 数；“核数”在此数的是相连的簇金属中心。','Denticity counts surface O donors contacting Ln; nuclearity here counts connected cluster metal centers.'),
 P('较短与较长的 Ln–M 路径可由不同几何贡献。作者结合第一层不对称性、外层散射和合理化学结构提出候选配位模式。','Shorter and longer Ln–M paths can have contributions from different geometries. The authors combine first-shell asymmetry, outer-shell scattering and chemical plausibility to propose candidate motifs.'),
 P('Figures 4–5 是作者提出的结构解释，不是对每种构型占比的唯一反演。Table S4 中一些外层路径不确定度很大，例如 UiO-68 的 Lu–Zr：4.64 ± 0.80 Å。','Figures 4–5 are proposed structural interpretations, not unique inversions of motif fractions. Some outer-shell fits have large uncertainties, e.g. Lu–Zr in UiO-68: 4.64 ± 0.80 Å.')]))}${src(P('来源：Figures 4–6，§3.3–3.5，SI Table S4。','Sources: Figures 4–6, §3.3–3.5, SI Table S4.'))}`)}

function evidence(){const fit=fitData[S.mat+':'+S.ln];return section(4,`<div class="grid2"><div class="card"><div class="source-tag">${T(P('实验数据 · 可切换归一化方式','Experimental data · Switch normalization'))}</div><h3>${T(P('“更会吸附”取决于分母','“Higher uptake” depends on the denominator'))}</h3><div class="row"><select id="chartElement" aria-label="${txt(P('图表元素','Chart element'))}">${['Nd','Gd','Lu'].map(l=>`<option ${S.ln===l?'selected':''}>${l}</option>`).join('')}</select>${button(P('每单位表面积','Per surface area'),`data-metric="area" aria-pressed="${S.metric==='area'}"`)}${button(P('每单位质量','Per mass'),`data-metric="mass" aria-pressed="${S.metric==='mass'}"`)}</div><div id="bars">${bars()}</div>${src(P('精确数值：SI Table S3（第 8 页）；实验条件：正文 §2.3，Figure 2。','Exact values: SI Table S3 (p. 8); conditions: article §2.3, Figure 2.'),true)}</div><div class="card"><div class="source-tag">${T(P('局部配位 · 与上方材料选择联动','Local coordination · Linked to material selection'))}</div><h3>${mats[S.mat].n} / ${S.ln}</h3>${fit?`<table><thead><tr><th>${T(P('散射路径','Scattering path'))}</th><th>${T(P('拟合距离 R / Å','Fitted distance R / Å'))}</th></tr></thead><tbody>${fit.map(v=>`<tr><td>${v[0]}</td><td>${v[1]}</td></tr>`).join('')}</tbody></table><p class="small muted" style="margin-top:15px">${T(P('误差：原文 95% 置信水平（2σ）。这里采用 SI Table S4 的逐样品数值；不混用正文概述中的近似值。','Errors: 95% confidence level (2σ) as reported. Per-sample values are taken from SI Table S4 rather than mixing approximate summaries in the main text.'))}</p>`:`<div class="callout">${T(P('未报告这组样品的 XAFS 拟合。吸附数据不替代局部结构证据。','No XAFS fit is reported for this combination. Uptake data are not a substitute for local structural evidence.'))}</div>`}${src(P('来源：SI Table S4，第 9–10 页。','Source: SI Table S4, pp. 9–10.'),true)}${S.depth===2?note(P('外层配位数与无序参数可能高度不确定。不能从拟合路径数直接数出样品中配合物的种类或比例。','Outer-shell coordination numbers and disorder parameters can be highly uncertain. The number of fitted paths does not directly count the species or fractions present.')):''}</div></div><div class="callout" style="margin:22px 0">${T(P('共同条件：初始 Ln 0.2 mM、MOF 200 ± 2 mg / 50 mL、pH 6.6 ± 0.1、100 mM HEPES。吸附动力学显示约 48 h 达平衡；UiO-68-NH₂ 仅反应 4.5 h，其余 66.5 h。这是单离子低覆盖条件的摄取量，不是饱和容量 qₘₐₓ，也不是混合稀土的分离因子。','Common conditions: initial Ln 0.2 mM, MOF 200 ± 2 mg / 50 mL, pH 6.6 ± 0.1, 100 mM HEPES. Kinetics indicated equilibrium around 48 h; UiO-68-NH₂ reacted for 4.5 h and the others for 66.5 h. These are single-ion, low-coverage uptakes, not saturation capacities qₘₐₓ or mixed-Ln separation factors.'))}</div>${note(pairDepth([
 P('试一试：选择 Lu，把“每单位表面积”改成“每单位质量”。UiO 材料之间的差异明显改变，说明归一化方式影响比较。','Try Lu, then switch from per-area to per-mass uptake. Differences among UiO materials change substantially, showing why normalization matters.'),
 P('表面积归一化下总体为 Nd ≈ Gd > Lu；mg/g 不能直接比较元素亲和力，因为元素摩尔质量不同。本文材料没有表现出足够的 Ln 单元素选择性。','Area-normalized uptake generally follows Nd ≈ Gd > Lu. Values in mg/g cannot directly compare elemental affinity because molar masses differ. These materials do not demonstrate sufficient individual-Ln selectivity.'),
 P('低覆盖约 0.002–0.037 Ln 原子/nm²，旨在探测有利位点。高容量或竞争体系可能占据其他位点，因此局部结构不应无条件外推。','Coverage is approximately 0.002–0.037 Ln atoms/nm², intended to probe favorable sites. Higher loading or competitive mixtures may populate other sites, limiting structural extrapolation.')]))}<div class="grid2">${evidenceCards.map(v=>`<details><summary>${T(v[0])}</summary><div class="inside"><div class="source-tag">${T(P('问题 → 对照 → 证据','Question → control → evidence'))}</div><p>${T(v[1])}</p><div class="callout">${T(v[2])}</div>${src(v[3])}</div></details>`).join('')}</div>`,P('点选条形图左侧的材料名，可同步查看局部配位证据。两种测量回答的是不同问题。','Select a material name beside a bar to inspect its coordination evidence. Uptake and spectroscopy answer different questions.'))}

 {n:6,w:803,h:792,page:'48543',title:P('PAA 与氨基不同：它如何让位点发生转移？','How does PAA redirect the binding site?'),alt:P('Figure 6：通过酰胺键接枝 PAA 的合成示意、Gd 的 DFT 构型，以及膦酸基处双齿和单齿候选配合物。','PAA grafting scheme, a Gd DFT configuration, and proposed phosphonate binding motifs.'),take:P('这里的关键是出现 Gd–P 近邻证据，而不只是柱子变高。','The key evidence is the appearance of Gd–P neighbors alongside the uptake change.'),look:P('A→B：PAA 通过酰胺键接到有机连接体上，保留可配位的膦酸基。C 是 DFT 模型中的 Gd 构型；D、E 是作者根据 XAFS 提出的双齿共享边与单齿构型。','A→B: PAA is grafted onto the linker through an amide bond, leaving the phosphonate group available. C is a Gd DFT configuration; D and E are the bidentate edge-sharing and monodentate motifs proposed from XAFS.'),supports:P('结构判断来自 Figure 6、SI Figure S10 与 Table S4 的组合：Gd–P = 2.83 ± 0.02、3.68 ± 0.04 Å；较弱的 Gd–Zr = 4.67 ± 0.05 Å 说明节点结合并未完全消失。静态 DFT 也偏向 PAA 位点。','The assignment combines Figure 6, SI Figure S10 and Table S4: Gd–P = 2.83 ± 0.02 and 3.68 ± 0.04 Å; weaker Gd–Zr = 4.67 ± 0.05 Å indicates residual node binding. Static DFT also favors the PAA site.'),limit:P('D、E 是候选结构示意，不是直接拍摄的分子照片，也没有给出各物种比例。PAA 体系的局部配位只测了 Gd；−1.07 eV 不是相邻稀土分离自由能。','D and E are proposed structures, not molecular photographs or measured species fractions. Only Gd was structurally examined with PAA; −1.07 eV is not an adjacent-Ln separation free energy.'),link:'#deep',linkText:P('继续看 DFT 比较了什么 ↓','Read what the DFT comparison means ↓')},

function sourceReader(){return `<section class="section" id="figures" aria-labelledby="figures-title"><div class="section-head"><div><div class="num">04B / ${T(P('原文图解','READ THE ORIGINAL FIGURES'))}</div><h2 id="figures-title">${T(P('回到原图，验证四个判断','Four questions for the original figures'))}</h2></div><p>${T(P('点开原图，按“先看什么 → 支持什么 → 不能推出什么”阅读。把作者的图、实验信号与讲解中的推断连接起来。','Open each figure and follow what to inspect, what it supports, and what remains unproven. Connect the original graphics, measured signals and interpretation.'))}</p></div><p class="small muted">${T(P('原图节选自 Ilgen et al. (2024) 正文；仅裁去周围正文，未改变图内数据或结构。图像可点开查看大图。','Figures reproduced from Ilgen et al. (2024), cropped from the article without changing the plotted data or structures. Open an image to inspect it at full size.'))}</p>${sourceFigures.map(f=>`<details class="source-figure" id="original-figure-${f.n}"><summary><span class="figure-number">FIG. ${f.n}</span><span>${T(f.title)}</span></summary><div class="figure-layout"><figure class="figure-image"><a href="./assets/figure-${f.n}.png" target="_blank" rel="noopener" data-figure-image="${f.n}" aria-label="${txt(P('在新标签页查看原图','View the original figure in a new tab'))} ${f.n}"><img src="./assets/figure-${f.n}.png" width="${f.w}" height="${f.h}" loading="lazy" decoding="async" data-source-figure="${f.n}" alt="${txt(f.alt)}"></a><figcaption>Ilgen et al. · ACS AMI 2024 · Figure ${f.n} · p. ${f.page} · <a href="${DOI}" target="_blank" rel="noopener">DOI ↗</a></figcaption></figure><div class="figure-reading"><div class="figure-takeaway">${T(f.take)}</div><h3>${T(P('① 先看什么','① What to inspect'))}</h3><p>${T(f.look)}</p><h3>${T(P('② 支持什么','② What it supports'))}</h3><p>${T(f.supports)}</p><h3>${T(P('③ 不能推出什么','③ What it does not establish'))}</h3><p>${T(f.limit)}</p><div class="figure-route"><a href="${f.link}">${T(f.linkText)}</a></div></div></div></details>`).join('')}</section>`}
function massCalc(){const c=S.ce,q=(.2-c)*.05/.2*157.25;return `<div class="stat">${q.toFixed(2)} <span style="font-size:16px">mg g⁻¹</span></div><p class="small">${T(P(`教学计算：Gd，假设 Cₑ = ${c.toFixed(2)} mM；去除率 ${(100*(.2-c)/.2).toFixed(0)}%。`,`Teaching calculation: Gd, assumed Cₑ = ${c.toFixed(2)} mM; removal = ${(100*(.2-c)/.2).toFixed(0)}%.`))}</p>`}
function deep(){return section(5,`<div class="grid2"><div class="card"><div class="source-tag">DFT / §2.5 + §3.5</div><h3>${T(P('PAA 位点比节点位点更有利','The PAA site is favored over the node site'))}</h3><div class="energy"><div class="level zero">${T(P('Zr 氧簇位点（参照）','Zr oxo-cluster site (reference)'))}<br>0 eV</div><div class="arrow">−1.07 eV</div><div class="band"></div><div class="level paa">${T(P('PAA 位点','PAA site'))}<br>−1.07 ± 0.07 eV</div></div><p class="small muted">${T(P('能量差图：同组成、同原子数、形式电中性的模型直接比较；阴影表示文中质子化构型变化范围，不是实验误差或自由能置信区间。','Energy comparison: models have the same composition and atom count and are formally neutral. Shading represents the reported variation across protonation configurations, not experimental error or a free-energy confidence interval.'))}</p>${src(P('原文 §3.5；模拟构型：Figure 6C；设置：§2.5。','Article §3.5; modeled configuration: Figure 6C; settings: §2.5.'))}</div><div class="card"><h3>${T(P('负能量差 ≠ 水中分离自由能','A negative energy difference ≠ aqueous separation free energy'))}</h3>${T(pairDepth([
 P('这项计算帮助解释“Gd 为什么更喜欢 PAA 位点”。它并没有计算混合水溶液里 Nd 与 Gd 谁更容易被分离。','The calculation helps explain why Gd favors PAA sites. It does not calculate separation between Nd and Gd in an aqueous mixture.'),
 P('VASP / PBE，400 eV，Γ 点；UiO-66 立方胞边长 20.95 Å。用少量 H₂O/OH⁻ 配成六配位 Gd 环境，对照 PAA 与单齿 Zr 氧簇位点；在不同质子化构型间测试敏感性。','VASP / PBE, 400 eV, Γ-point sampling; cubic UiO-66 cell length 20.95 Å. A small number of H₂O/OH⁻ species complete a six-coordinate Gd environment. PAA and a monodentate Zr-oxo site are compared across protonation configurations.'),
 P('零温“干态 + 少量水”静态 DFT；NO₃⁻ 被假定为不配位的旁观者。PAA 构型的质子化变化引起 0.14 eV 差异，作者报告 −1.07 ± 0.07 eV。模型缺少充水孔道、体相水库与充分热采样，不能用此值直接算溶液选择性或 Boltzmann 分配。','Static zero-temperature DFT under “dry + a few waters” conditions; NO₃⁻ is assumed to be a noncoordinating spectator. Protonation changes the PAA configuration energy by 0.14 eV, summarized as −1.07 ± 0.07 eV. The model lacks a water-filled pore, a bulk-water reservoir and thermal sampling, so this value must not be used directly for solution selectivity or Boltzmann partitioning.')]))}<details><summary>${T(P('作者认为更严格的计算是什么？','What calculation do the authors consider more rigorous?'))}</summary><div class="inside">${T(P('在充水 UiO-66 中做 ab initio molecular dynamics 的势均力（potential of mean force），并包含类似体相的水库；本文未进行该计算。','Ab initio molecular-dynamics potential-of-mean-force calculations in water-filled UiO-66, including a bulk-water-like reservoir. This was not performed.'))}</div></details></div></div>
<div class="grid2" style="margin-top:20px"><div class="card"><div class="source-tag">${T(P('教学公式 · 定义，不是论文编号方程','Teaching formula · A definition, not a numbered paper equation'))}</div><h3>${T(P('从水相减少量计算吸附量','Calculate uptake from solution depletion'))}</h3><div class="math"><math display="block"><msub><mi>q</mi><mi>e</mi></msub><mo>=</mo><mfrac><mrow><mo>(</mo><msub><mi>C</mi><mn>0</mn></msub><mo>−</mo><msub><mi>C</mi><mi>e</mi></msub><mo>)</mo><mi>V</mi></mrow><mi>m</mi></mfrac></math></div><p>${T(P('C₀/Cₑ：初始/剩余浓度；V：溶液体积；m：MOF 质量。下方固定 Gd 摩尔质量 157.25 g/mol、C₀ = 0.2 mM、V = 50 mL、m = 0.2 g。','C₀/Cₑ: initial/remaining concentration; V: solution volume; m: MOF mass. Below, Gd molar mass is fixed at 157.25 g/mol, C₀ = 0.2 mM, V = 50 mL, m = 0.2 g.'))}</p><label class="field" for="ce">${T(P('拖动假设的剩余浓度 Cₑ（mM）','Vary the assumed remaining concentration Cₑ (mM)'))}<input class="range" id="ce" type="range" min="0" max="0.2" step="0.01" value="${S.ce}"></label><div id="masscalc" aria-live="polite">${massCalc()}</div><div class="callout">${T(P('教学示意，非 Table S3 新数据；不是吸附等温线或饱和容量拟合。公式展示 §2.3 水相质量平衡的逻辑。','Teaching illustration, not additional Table S3 data; not an isotherm or saturation-capacity fit. The formula illustrates the solution mass-balance logic of §2.3.'))}</div></div><div class="card"><div class="source-tag">SI / Table S4 · ${T(P('拟合诊断','Fit diagnostics'))}</div><h3>${T(P('拟合得好，不等于结构唯一','A good fit does not make a structure unique'))}</h3><div class="math"><math display="block"><msub><mi>R</mi><mtext>factor</mtext></msub><mo>=</mo><mfrac><mrow><munder><mo>∑</mo><mi>i</mi></munder><msup><mrow><mo>(</mo><msub><mi>d</mi><mi>i</mi></msub><mo>−</mo><msub><mi>f</mi><mi>i</mi></msub><mo>)</mo></mrow><mn>2</mn></msup></mrow><mrow><munder><mo>∑</mo><mi>i</mi></munder><msubsup><mi>d</mi><mi>i</mi><mn>2</mn></msubsup></mrow></mfrac></math></div><p>${T(P('来自 Table S4 脚注 6（无方程编号）：dᵢ 为数据，fᵢ 为拟合值；R-factor 越小，残差相对越小，但不证明候选结构唯一。','From Table S4 footnote 6 (unnumbered): dᵢ is the data and fᵢ the fit. A smaller R-factor indicates smaller relative residuals, but does not establish a unique candidate structure.'))}</p>${S.depth>0?`<p class="muted">${T(P('R 空间同时拟合 k 权重 1、2、3；k = 3.7–10.7 Å⁻¹，R = 1.2–4.5 Å（未相移校正的拟合窗口）。S₀：Nd 0.92、Gd 0.91、Lu 0.79。不要把傅里叶变换峰位直接读成拟合键长。','R-space fitting uses k-weights 1, 2 and 3 simultaneously; k = 3.7–10.7 Å⁻¹ and R = 1.2–4.5 Å (uncorrected fitting window). S₀: Nd 0.92, Gd 0.91, Lu 0.79. Fourier-transform peak positions must not be read directly as fitted bond lengths.'))}</p>`:''}${src(P('来源：SI Table S4 及脚注 6，第 9–10 页；正文 §2.4。','Source: SI Table S4 and footnote 6, pp. 9–10; article §2.4.'),true)}${S.depth===2?`<div class="callout">${T(P('注意数据版本：正文 §2.4 把拟合误差误指向 Table S3；实际拟合表是 SI Table S4。本页统一以 Table S4 为准。','Cross-reference note: §2.4 points fitting errors to Table S3; the actual fitting table is SI Table S4, used consistently here.'))}</div>`:''}</div></div>`,P('把静态能量、实验吸附量和谱学拟合放回各自的前提中。','Keep static energies, measured uptake and spectroscopic fits within their respective assumptions.'))}

 [P('PAA 竞争过节点','PAA outcompetes nodes'),P('Gd–P 路径 + 相对能量 −1.07 ± 0.07 eV','Gd–P paths + relative energy −1.07 ± 0.07 eV'),P('局部结构证据针对 Gd；不是混合 Ln 的选择性因子。','The structural evidence concerns Gd; this is not a mixed-Ln selectivity factor.')],

function critical(){return section(6,`<div class="scroll"><table><thead><tr><th>${T(P('主张','Claim'))}</th><th>${T(P('支持证据','Evidence'))}</th><th>${T(P('尚存不确定性','Uncertainty'))}</th></tr></thead><tbody>${criticalChains.map(c=>`<tr>${c.map(v=>`<td>${T(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="grid2" style="margin-top:24px"><div class="card"><div class="source-tag">${T(P('原文中的未解决问题','Unresolved in the paper'))}</div><h3>${T(P('哪些作用还没有分清？','Which effects remain unresolved?'))}</h3><p>${T(P('氨基如何间接提高节点的吸附能力？“理想” UiO 的配位是否伴随水解？孔内局部 pH 是多少？为何出现非直觉的共享边构型？','How do amino groups indirectly increase node uptake? Does binding in “ideal” UiO involve hydrolysis? What is the pore-local pH? Why are counterintuitive edge-sharing motifs observed?'))}</p>${src('§3.3–3.6 · §4')}</div><div class="card"><div class="source-tag">${T(P('讲解者分析 · 后续实验建议','Explainer analysis · Suggested next experiments'))}</div><h3>${T(P('让“位点设计”走向“分离”','From site design to separation'))}</h3><p>${T(P('在混合 Ln 中测竞争吸附与分离因子；统一反应时间和缺陷程度；改变负载量追踪位点占据；用充水自由能计算和原位表征检验位点转移。','Measure competitive uptake and separation factors in mixed Ln; match reaction times and defect levels; track site occupation with loading; test site transfer using hydrated free-energy calculations and in situ characterization.'))}</p><div class="callout">${T(P('这些是待验证的研究方向，不是本文已经完成的结果。本文未报告新的柱分离、全系相邻 Ln 分离因子或长期工艺成本。','These are proposals for validation, not completed results. This paper reports no new column separation, full-series adjacent-Ln separation factors or long-term process costs.'))}</div></div></div>`)}

 [P('未来方向','Future directions'),P('混合金属节点、选择性配体、竞争分离与真实水环境。','Mixed-metal nodes, selective ligands, competitive separation and realistic hydration.'),'critical']
];
const takeaways=[P('吸附量回答“多少”；局部配位回答“在哪里”。','Uptake answers “how much”; coordination answers “where”.'),P('氨基化增加摄取量，不足以证明 Ln–N 直接结合。','An amino-induced uptake increase does not establish direct Ln–N binding.'),P('金属氧簇本身是位点；PAA 能使 Gd 的主要结合位置转移。','Metal oxo clusters are binding sites; PAA can redirect predominant Gd binding.'),P('缺陷与孔径效应必须在表征敏感度和对照条件内理解。','Interpret defect and pore-size effects within measurement sensitivity and control conditions.'),P('位点机制是选择性设计的起点，尚不是 Ln 单元素分离的证明。','Site mechanisms motivate selective design; they do not demonstrate individual-Ln separation.')];
const quizzes=[
 [P('为什么只测溶液中 Ln 减少了多少还不够？','Why is solution depletion alone insufficient?'),P('相同的摄取量可以来自不同位点。必须结合 Ln–O 第一层和 Cr/Zr/P 外层信息，才可能区分节点与官能团。','The same uptake can arise from different sites. Ln–O first-shell and Cr/Zr/P outer-shell information are needed to distinguish nodes from functional groups.')],
 [P('PAA 样品里 Gd–P 与 Gd–Zr 同时出现，你会如何解释？','How would you interpret both Gd–P and Gd–Zr paths in the PAA sample?'),P('它们支持以膦酸基结合为主，同时可能保留节点结合。不能简单写“所有 Gd 完全转移”。路径强度也不是未经校正的位点占比。','They support predominant phosphonate binding with possible residual node binding. “All Gd completely transferred” would be too strong, and path intensity is not an uncorrected site fraction.')],
 [P('两种 UiO 的 Lu 第一层相近，能否说孔径不重要？','If Lu first shells are similar in two UiO materials, is pore size irrelevant?'),P('不能。只能说在本次谱学分辨能力下未见明显第一层差异；能量、动力学与可达性仍可能不同，且 UiO-68 的反应时间和缺陷构成混杂。','No. It only establishes no clear first-shell difference within this experiment’s sensitivity. Energetics, kinetics and accessibility may still differ; UiO-68 reaction time and defects confound comparison.')],
 [P('−1.07 eV 能证明 Nd/Gd 分离吗？下一步该测什么？','Does −1.07 eV prove Nd/Gd separation? What would you measure next?'),P('不能。这是 Gd 在两个位点的零温静态能量差。需要混合离子竞争实验、明确组成与平衡条件下的分离因子，以及含水与热采样的自由能比较。','No. It is a zero-temperature static energy difference for Gd at two sites. Competitive mixed-ion experiments, separation factors at specified composition and equilibrium, and hydrated, thermally sampled free energies are needed.')]
];
function knowledge(){const n=mapNodes[S.map];return section(7,`<div class="grid2"><div class="card"><h3>${T(P('中心思想：位点竞争','Central idea: site competition'))}</h3><div class="mapbuttons">${mapNodes.map((n,i)=>button(n[0],`data-map="${i}" aria-pressed="${S.map===i}"`)).join('')}</div></div><div class="card mapdetail" aria-live="polite"><div class="eyebrow">${T(P('知识地图','Knowledge map'))} / ${S.map+1}</div><h3>${T(n[0])}</h3><p class="lead">${T(n[1])}</p><a href="#${n[2]}">${T(P('返回对应章节 ↗','Jump to the section ↗'))}</a></div></div><div class="grid2" style="margin-top:24px"><div class="card takeaways"><h3>${T(P('五个关键收获','Five key takeaways'))}</h3>${takeaways.map(t=>`<div class="take">${T(t)}</div>`).join('')}</div><div><h3>${T(P('试着自己解释','Explain it yourself'))}</h3>${quizzes.map((q,i)=>`<details id="quiz${i}"><summary>${T(q[0])}</summary><div class="inside"><div class="source-tag">${T(P('参考解释','Reference explanation'))}</div>${T(q[1])}</div></details>`).join('')}</div></div>`)}
function render(){const open=[...document.querySelectorAll('details[open]')].map(d=>d.dataset.persist),scroll=window.scrollY,focused=document.activeElement,focusId=focused?.id,focusData=focused?.tagName==='BUTTON'?[...focused.attributes].find(a=>a.name.startsWith('data-')):null;document.getElementById('app').innerHTML=hero()+glance()+logicHTML()+lab()+glossaryHTML()+geometry()+evidence()+sourceReader()+deep()+critical()+knowledge()+`<footer class="foot"><div>Ilgen et al. · ACS AMI 2024 · DOI: <a href="${DOI}">10.1021/acsami.4c09445</a></div><p>${T(P('基于所提供正文与 SI 制作。所有实验值可回溯至原文；示意图与教学计算均有单独标签。最后核对：2026-10-28。','Built from the supplied article and SI. Experimental values are traceable to the paper; conceptual diagrams and teaching calculations are labeled separately. Last checked: 2026-10-28.'))}</p><a href="../../">${T(P('← 返回论文仓库','← Back to the paper atlas'))}</a></footer>`;document.querySelectorAll('[data-depth]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.depth)===S.depth));document.querySelectorAll('details').forEach((d,i)=>{d.dataset.persist=String(i);if(open.includes(String(i)))d.open=true;});setLang();window.scrollTo(0,scroll);const target=focusId?document.getElementById(focusId):focusData?document.querySelector(`button[${focusData.name}="${focusData.value}"]`):null;target?.focus({preventScroll:true});progress();}
function setLang(){
 document.body.dataset.lang=S.lang;
 document.documentElement.lang=S.lang==='en'?'en':'zh-CN';
 document.querySelectorAll('#depths button').forEach((b,i)=>{b.innerHTML=T([P('直觉','Intuition'),P('机制','Mechanism'),P('研究','Research')][i]);b.classList.toggle('active',i===S.depth);b.setAttribute('aria-pressed',String(i===S.depth));});
 document.querySelectorAll('svg[data-site-aria-zh]').forEach(e=>e.setAttribute('aria-label',S.lang==='en'?e.dataset.siteAriaEn:e.dataset.siteAriaZh));
 document.querySelectorAll('[data-site-label-zh]').forEach(e=>e.textContent=S.lang==='en'?e.dataset.siteLabelEn:e.dataset.siteLabelZh);
 document.querySelectorAll('[data-site-reference-link]').forEach(e=>e.setAttribute('aria-label',txt(P('在新标签页放大材料结构原图','Enlarge the original material structure in a new tab'))));
 document.querySelectorAll('[data-site-reference]').forEach(e=>{e.alt=txt(e.dataset.siteReference==='mil101'?
 P('Figure 1B：Cr-MIL-101 框架、Cr₃O 节点和两种 BDC 连接体','Figure 1B: Cr-MIL-101 framework, Cr₃O node and two BDC linkers'):
 P('Figure 1A：UiO 框架、Zr₆ 节点及 UiO-66、PAA 和 UiO-68 连接体','Figure 1A: UiO frameworks, Zr₆ node and UiO-66, PAA and UiO-68 linkers'));});
 document.querySelectorAll('[data-figure-image]').forEach(e=>e.setAttribute('aria-label',txt(P('在新标签页查看原图','View the original figure in a new tab'))+' '+e.dataset.figureImage));
 document.querySelectorAll('[data-source-figure]').forEach(e=>{const figure=sourceFigures.find(f=>String(f.n)===e.dataset.sourceFigure);if(figure)e.alt=txt(figure.alt)});
 const ce=document.getElementById('chartElement');if(ce)ce.setAttribute('aria-label',txt(P('图表元素','Chart element')));
 document.querySelector('meta[name=description]').content=txt(P('交互式理解 Nd、Gd、Lu 在 Cr-MIL-101 和 UiO 系列 MOF 中的局部配位、位点竞争与实验证据。','Explore local coordination, site competition and evidence for Nd, Gd and Lu in Cr-MIL-101 and UiO metal–organic frameworks.'));
}
function progress(){}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;let change=true;if(b.dataset.depth!==undefined)S.depth=+b.dataset.depth;else if(b.dataset.step!==undefined)S.step=+b.dataset.step;else if(b.dataset.topo!==undefined)S.topo=+b.dataset.topo;else if(b.dataset.module!==undefined)S.module=+b.dataset.module;else if(b.dataset.map!==undefined)S.map=+b.dataset.map;else if(b.dataset.metric)S.metric=b.dataset.metric;else if(b.dataset.chartmat!==undefined)S.mat=+b.dataset.chartmat;else if(b.dataset.action==='prev')S.step=Math.max(0,S.step-1);else if(b.dataset.action==='next')S.step=Math.min(3,S.step+1);else if(b.dataset.action==='reset')S.step=0;else change=false;if(change){const selector=b.dataset.depth!==undefined?`[data-depth="${S.depth}"]`:b.dataset.action?`[data-action="${b.dataset.action}"]`:null;render();if(selector)document.querySelector(selector)?.focus({preventScroll:true});}});
document.addEventListener('change',e=>{if(e.target.id==='material'){S.mat=+e.target.value;render();}if(e.target.id==='element'||e.target.id==='chartElement'){S.ln=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='ce'){S.ce=+e.target.value;document.getElementById('masscalc').innerHTML=massCalc();}});render();
AtlasPaper.init({shortTitle:'Ln local coordination', title:{zh:'稀土 × MOF 局部配位｜交互式论文讲解',en:'Lanthanides × MOF Local Coordination | Interactive Explainer'},allowBoth:true,depth:document.getElementById('depths'),legacyHeader:document.querySelector('header.top'),sections:[{id:'glance',zh:'概览',en:'Overview'},{id:'logic',zh:'研究逻辑',en:'Logic'},{id:'lab',zh:'位点实验室',en:'Site lab'},{id:'geometry',zh:'配位几何',en:'Geometry'},{id:'evidence',zh:'实验证据',en:'Evidence'},{id:'figures',zh:'原文图解',en:'Original figures'},{id:'deep',zh:'技术深入',en:'Deep dive'},{id:'critical',zh:'批判性理解',en:'Critique'},{id:'map',zh:'知识整合',en:'Knowledge map'}],onLanguageChange(lang){S.lang=lang;setLang();}});
