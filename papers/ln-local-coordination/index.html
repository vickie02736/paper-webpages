'use strict';
const P=(zh,en)=>[zh,en];
const S={lang:'zh',depth:0,mat:2,ln:'Gd',step:0,topo:0,metric:'area',map:0,module:0,ce:0.1};
const DOI='https://doi.org/10.1021/acsami.4c09445';
const SI='https://acs.figshare.com/doi/suppl/10.1021/acsami.4c09445';
const T=v=>typeof v==='string'?v:`<span class="paired"><span class="zh" lang="zh-CN">${v[0]}</span><span class="en" lang="en">${v[1]}</span></span>`;
const txt=v=>typeof v==='string'?v:v[S.lang==='en'?1:0];
const src=(v,si=false)=>`<div class="source">↳ <a href="${si?SI:DOI}" target="_blank" rel="noopener">${T(v)}</a></div>`;
const button=(v,attrs='')=>`<button ${attrs}>${T(v)}</button>`;
const note=v=>`<div class="depthnote">${T(v)}</div>`;
const pairDepth=a=>a[S.depth];
const mats=[
 {n:'Cr-MIL-101',sa:2350,pore:'2.9 / 3.4',link:'—',pz:'5.3',metal:'Cr',q:[1.7,1.8,1.0],area:[.501,.494,.250],xafs:['Lu']},
 {n:'Cr-MIL-101-NH₂',sa:1780,pore:'2.9 / 3.4',link:'—',pz:'7.1',metal:'Cr',q:[6.4,6.9,7.0],area:[2.49,2.47,2.25],xafs:['Lu']},
 {n:'UiO-66',sa:1400,pore:'0.8 / 1.1',link:'5.3',pz:'≈4.5',metal:'Zr',q:[7.0,7.1,7.2],area:[3.46,3.24,2.92],xafs:['Nd','Gd','Lu']},
 {n:'UiO-66-NH₂ · ideal',sa:850,pore:'0.8 / 1.1',link:'6.0',pz:'3.4',metal:'Zr',q:[6.6,6.9,6.8],area:[5.40,5.16,4.57],xafs:['Nd','Gd','Lu']},
 {n:'UiO-66-NH₂ · defective',sa:1190,pore:'0.8 / 1.1',link:'5.8',pz:'5.6',metal:'Zr',q:[6.6,7.1,7.1],area:[3.87,3.79,3.41],xafs:['Nd','Lu']},
 {n:'UiO-66-NH-PAA',sa:820,pore:'0.8 / 1.1',link:'≈6.0',pz:'≈3',metal:'Zr',q:[7.2,7.2,7.2],area:[6.07,5.56,4.99],xafs:['Gd']},
 {n:'UiO-68-NH₂',sa:1310,pore:'1.8',link:'—',pz:'<1',metal:'Zr',q:[7.2,7.2,7.2],area:[3.80,3.49,3.14],xafs:['Gd','Lu']}
];
const copy={
 hero:P('稀土离子，<br>究竟抓住了谁？','What does a<br>lanthanide really bind to?'),
 lead:P('把“吸附了多少”拆成“结合在哪里”。用局部配位证据，重新理解金属氧簇、缺陷与官能团的竞争。','Go from “how much is captured?” to “where does it bind?” Read the competition between metal oxo clusters, defects and functional groups through local coordination evidence.'),
 titles:[P('30 秒主线','At a glance'),P('从吸附量到原子位点','From uptake to atomic sites'),P('逐步走进配位现场','Inside the coordination site'),P('两个“齿”，连接几个中心？','Two donor atoms, how many centers?'),P('让数据回答问题','Read the evidence'),P('计算究竟比较了什么？','What did the calculation compare?'),P('结论的边界在哪里？','Where does the evidence stop?'),P('知识地图与自检','Connect and explain')],
 nav:[P('概览','Overview'),P('研究逻辑','Logic'),P('位点实验室','Site lab'),P('配位几何','Geometry'),P('实验证据','Evidence'),P('技术深入','Deep dive'),P('批判性理解','Critique'),P('知识整合','Knowledge map')],
 ids:['glance','logic','lab','geometry','evidence','deep','critical','map'],
 depth:[P('直觉层 · 看见“吸附量”和“位点”之间的区别。','Intuition · Separate the amount adsorbed from the identity of the binding site.'),P('机制层 · 连接材料对照、局部配位与谱学判据。','Mechanism · Connect material controls, coordination geometry and spectroscopic fingerprints.'),P('研究层 · 检查拟合不确定度、模型前提和结论边界。','Research · Inspect fit uncertainty, modeling assumptions and limits of inference.')]
};
function section(i,body,intro){return `<section class="section" id="${copy.ids[i]}"><div class="section-head"><div><div class="num">0${i} / ${['ORIENTATION','RESEARCH LOGIC','SITE LAB','GEOMETRY','EVIDENCE','DEEP DIVE','CRITICAL THINKING','SYNTHESIS'][i]}</div><h2>${T(copy.titles[i])}</h2></div>${intro?`<p>${T(intro)}</p>`:''}</div>${body}</section>`}
function atom(x,y,r,el,c){return `<circle class="atom" cx="${x}" cy="${y}" r="${r}" fill="${c}"/><text x="${x}" y="${y+5}" text-anchor="middle" style="fill:#081825;font-weight:750;font-size:${r<18?12:16}px">${el}</text>`}
function bond(x,y,a,b,cls=''){return `<line class="bond ${cls}" x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`}
function siteSVG(hero=false){const m=hero?mats[5]:mats[S.mat],paa=hero||S.mat===5,st=hero?3:S.step,ln=hero?'Gd':S.ln;let x=st<2?145:273,y=st<2?95:193;let g=`<circle class="halo" cx="300" cy="205" r="115"/><circle class="halo" cx="300" cy="205" r="90"/>`;
 g+=bond(405,215,450,150)+bond(405,215,455,275)+bond(450,150,485,215)+bond(455,275,485,215);
 g+=bond(405,215,339,167)+bond(405,215,339,252)+bond(339,167,299,130)+bond(299,130,210,155)+bond(210,155,185,207)+bond(185,207,214,263)+bond(214,263,299,285)+bond(299,285,339,252);
 if(paa){g+=bond(214,263,184,300)+bond(184,300,140,296)+bond(140,296,110,251)+bond(110,251,165,227);g+=atom(140,296,21,'P','#ffbd79')+atom(184,300,14,'O','#ff8585')+atom(110,251,14,'O','#ff8585');x=st<2?85:120;y=st<2?95:201;}
 if(st>=2){g+=bond(x,y,paa?110:339,paa?251:167,'new');if(S.depth>0)g+=bond(x,y,paa?165:339,paa?227:252,'new');}
 for(const [a,b] of [[405,215],[450,150],[455,275],[485,215]])g+=atom(a,b,24,m.metal,m.metal==='Cr'?'#d2a4ef':'#6fe0d0');
 g+=atom(339,167,15,'O','#ff8585')+atom(339,252,15,'O','#ff8585')+atom(299,130,13,'C','#b2c2d3')+atom(210,155,13,'C','#b2c2d3')+atom(185,207,13,'C','#b2c2d3')+atom(214,263,13,'C','#b2c2d3')+atom(299,285,13,'C','#b2c2d3');
 if(m.n.includes('NH₂')&&!paa)g+=bond(185,207,151,230)+atom(151,230,17,'N','#8bb7ff');
 if(!hero&&S.mat===4&&S.depth>0)g+=`<path d="M340 272 L395 300" stroke="#ffbd79" stroke-width="3" stroke-dasharray="5 6"/><text x="425" y="314" text-anchor="middle" style="font-size:12px">−BDC</text>`;
 if(paa)g+=atom(165,227,14,'O','#ff8585');
 const waters=st<2?[[x-45,y-20],[x+35,y-35],[x+52,y+25],[x-32,y+40]]:[[x-45,y-25],[x-15,y+55]];
 for(const [a,b] of waters){g+=bond(x,y,a,b,'weak')+atom(a,b,11,'O','#ff8585');}
 g+=atom(x,y,28,ln,'#d4ef8a');if(st===3){g+=`<circle cx="${x}" cy="${y}" r="42" stroke="#d4ef8a" fill="none" stroke-dasharray="3 4"/>`+bond(x+15,y+12,paa?140:405,paa?296:215,'weak');}
 return `<svg viewBox="0 0 560 360" role="img" aria-label="${txt(P('镧系离子与金属氧簇或膦酸基结合的概念示意','Conceptual lanthanide binding at a metal oxo cluster or phosphonate group'))}">${g}</svg>`;
}
function hero(){return `<div class="hero"><div><div class="eyebrow">Coordination chemistry / ACS AMI 2024</div><h1>${T(copy.hero)}</h1><p class="lead">${T(copy.lead)}</p><div class="chips"><span class="chip lime">Nd³⁺ · Gd³⁺ · Lu³⁺</span><span class="chip">XAFS + DFT</span><span class="chip">Cr-MIL-101 · UiO</span></div><a href="#lab">${T(P('进入位点实验室 ↓','Enter the site lab ↓'))}</a></div><div class="diagram">${siteSVG(true)}<div class="legend"><span><i class="dot" style="background:var(--lime)"></i>Ln</span><span><i class="dot" style="background:var(--red)"></i>O</span><span><i class="dot"></i>Zr / Cr</span><span><i class="dot" style="background:var(--orange)"></i>P</span></div><div class="concept">${T(P('概念示意 · 非晶体坐标；球的数量不代表完整配位数。','Conceptual illustration · Not crystallographic coordinates; spheres do not represent the full coordination number.'))}</div></div></div>
<div class="card"><div class="eyebrow">The paper</div><h3>Local Coordination Environment of Lanthanides Adsorbed onto Cr- and Zr-based Metal–Organic Frameworks</h3><p class="small muted">Anastasia G. Ilgen · R. Eric Sikma · Dorina F. Sava Gallis · Kevin Leung · Chengjun Sun · Boyoung Song · Kadie M. M. Sanchez · Jacob G. Smith</p><div class="row small"><span>ACS Applied Materials &amp; Interfaces 2024, 16, 48536–48546 · 26 Aug 2024</span><a href="${DOI}" target="_blank" rel="noopener">${T(P('原文 ↗','Article ↗'))}</a><a href="${SI}" target="_blank" rel="noopener">${T(P('补充材料 ↗','Supporting information ↗'))}</a></div><p class="small muted" style="margin-top:12px;margin-bottom:0">${T(P('阅读范围：用户提供的出版社正文 11 页与 Supporting Information 12 页。本文是一项结合位点的机制研究，尚未实现单一镧系元素的选择性分离。','Reading scope: the supplied 11-page publisher article and 12-page supporting information. This is a binding-site mechanism study; selective separation of individual lanthanides was not achieved.'))}</p></div>${note(copy.depth[S.depth])}`}
function glance(){const a=[
 [P('问题','Problem'),P('吸附量变化，不能告诉我们离子结合在金属节点还是官能团上。','A change in uptake does not identify whether ions bind to metal nodes or functional groups.')],
 [P('关键思想','Key idea'),P('从 Ln 看周围的 O、Cr/Zr 与 P：用近邻“指纹”辨别结合位点。','Look outward from Ln to O, Cr/Zr and P: identify sites through local-neighbor fingerprints.')],
 [P('关键发现','Key finding'),P('未接 PAA 时，证据指向金属氧簇；接 PAA 后，Gd 主要结合膦酸基。','Without PAA, evidence points to metal oxo clusters; after PAA installation, Gd binds predominantly to phosphonate groups.')]
];return section(0,`<div class="grid3">${a.map((x,i)=>`<div class="card"><div class="source-tag">0${i+1} / ${T(x[0])}</div><h3>${T(x[1])}</h3></div>`).join('')}</div>${src(P('证据：§3.3–3.5，Figures 3–6；结论：§4。','Evidence: §3.3–3.5, Figures 3–6; conclusions: §4.'))}${note(pairDepth([
 P('记住一条主线：测总量 → 识别近邻 → 判断位点 → 提出未来选择性设计。','One storyline: measure uptake → identify neighbors → assign binding sites → propose future selective designs.'),

/div><div class="callout" style="margin:22px 0">${T(P('共同条件：初始 Ln 0.2 mM、MOF 200 ± 2 mg / 50 mL、pH 6.6 ± 0.1、100 mM HEPES。吸附动力学显示约 48 h 达平衡；UiO-68-NH₂ 仅反应 4.5 h，其余 66.5 h。这是单离子低覆盖条件的摄取量，不是饱和容量 qₘₐₓ，也不是混合稀土的分离因子。','Common conditions: initial Ln 0.2 mM, MOF 200 ± 2 mg / 50 mL, pH 6.6 ± 0.1, 100 mM HEPES. Kinetics indicated equilibrium around 48 h; UiO-68-NH₂ reacted for 4.5 h and the others for 66.5 h. These are single-ion, low-coverage uptakes, not saturation capacities qₘₐₓ or mixed-Ln separation factors.'))}</div>${note(pairDepth([

 P('表面积归一化下总体为 Nd ≈ Gd > Lu；mg/g 不能直接比较元素亲和力，因为元素摩尔质量不同。本文材料没有表现出足够的 Ln 单元素选择性。','Area-normalized uptake generally follows Nd ≈ Gd > Lu. Values in mg/g cannot directly compare elemental affinity because molar masses differ. These materials do not demonstrate sufficient individual-Ln selectivity.'),

const quizzes=[
 [P('为什么只测溶液中 Ln 减少了多少还不够？','Why is solution depletion alone insufficient?'),P('相同的摄取量可以来自不同位点。必须结合 Ln–O 第一层和 Cr/Zr/P 外层信息，才可能区分节点与官能团。','The same uptake can arise from different sites. Ln–O first-shell and Cr/Zr/P outer-shell information are needed to distinguish nodes from functional groups.')],
 [P('PAA 样品里 Gd–P 与 Gd–Zr 同时出现，你会如何解释？','How would you interpret both Gd–P and Gd–Zr paths in the PAA sample?'),P('它们支持以膦酸基结合为主，同时可能保留节点结合。不能简单写“所有 Gd 完全转移”。路径强度也不是未经校正的位点占比。','They support predominant phosphonate binding with possible residual node binding. “All Gd completely transferred” would be too strong, and path intensity is not an uncorrected site fraction.')],
 [P('两种 UiO 的 Lu 第一层相近，能否说孔径不重要？','If Lu first shells are similar in two UiO materials, is pore size irrelevant?'),P('不能。只能说在本次谱学分辨能力下未见明显第一层差异；能量、动力学与可达性仍可能不同，且 UiO-68 的反应时间和缺陷构成混杂。','No. It only establishes no clear first-shell difference within this experiment’s sensitivity. Energetics, kinetics and accessibility may still differ; UiO-68 reaction time and defects confound comparison.')],
 [P('−1.07 eV 能证明 Nd/Gd 分离吗？下一步该测什么？','Does −1.07 eV prove Nd/Gd separation? What would you measure next?'),P('不能。这是 Gd 在两个位点的零温静态能量差。需要混合离子竞争实验、明确组成与平衡条件下的分离因子，以及含水与热采样的自由能比较。','No. It is a zero-temperature static energy difference for Gd at two sites. Competitive mixed-ion experiments, separation factors at specified composition and equilibrium, and hydrated, thermally sampled free energies are needed.')]
];
function knowledge(){const n=mapNodes[S.map];return section(7,`<div class="grid2"><div class="card"><h3>${T(P('中心思想：位点竞争','Central idea: site competition'))}</h3><div class="mapbuttons">${mapNodes.map((n,i)=>button(n[0],`data-map="${i}" aria-pressed="${S.map===i}"`)).join('')}</div></div><div class="card mapdetail" aria-live="polite"><div class="eyebrow">Knowledge map / ${S.map+1}</div><h3>${T(n[0])}</h3><p class="lead">${T(n[1])}</p><a href="#${n[2]}">${T(P('返回对应章节 ↗','Jump to the section ↗'))}</a></div></div><div class="grid2" style="margin-top:24px"><div class="card takeaways"><h3>${T(P('五个关键收获','Five key takeaways'))}</h3>${takeaways.map(t=>`<div class="take">${T(t)}</div>`).join('')}</div><div><h3>${T(P('试着自己解释','Explain it yourself'))}</h3>${quizzes.map((q,i)=>`<details id="quiz${i}"><summary>${T(q[0])}</summary><div class="inside"><div class="source-tag">${T(P('参考解释','Reference explanation'))}</div>${T(q[1])}</div></details>`).join('')}</div></div>`)}
function render(){const open=[...document.querySelectorAll('details[open]')].map(d=>d.dataset.persist),scroll=window.scrollY,focused=document.activeElement,focusId=focused?.id,focusData=focused?.tagName==='BUTTON'?[...focused.attributes].find(a=>a.name.startsWith('data-')):null;document.getElementById('app').innerHTML=hero()+glance()+logicHTML()+lab()+glossaryHTML()+geometry()+evidence()+deep()+critical()+knowledge()+`<footer class="foot"><div>Ilgen et al. · ACS AMI 2024 · DOI: <a href="${DOI}">10.1021/acsami.4c09445</a></div><p>${T(P('基于所提供正文与 SI 制作。所有实验值可回溯至原文；示意图与教学计算均有单独标签。最后核对：2026-10-26。','Built from the supplied article and SI. Experimental values are traceable to the paper; conceptual diagrams and teaching calculations are labeled separately. Last checked: 2026-10-26.'))}</p><a href="../../">${T(P('← 返回论文仓库','← Back to the paper atlas'))}</a></footer>`;document.getElementById('nav').innerHTML=copy.nav.map((v,i)=>`<a href="#${copy.ids[i]}">${T(v)}</a>`).join('');document.querySelectorAll('[data-depth]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.depth)===S.depth));document.querySelectorAll('details').forEach((d,i)=>{d.dataset.persist=String(i);if(open.includes(String(i)))d.open=true;});setLang();window.scrollTo(0,scroll);const target=focusId?document.getElementById(focusId):focusData?document.querySelector(`button[${focusData.name}="${focusData.value}"]`):null;target?.focus({preventScroll:true});progress();}
function setLang(){document.body.dataset.lang=S.lang;document.documentElement.lang=S.lang==='en'?'en':'zh-CN';document.querySelectorAll('button[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));document.getElementById('depths').setAttribute('aria-label',txt(P('学习深度','Learning depth')));document.getElementById('langs').setAttribute('aria-label',txt(P('页面语言','Page language')));document.querySelectorAll('svg[role=img]').forEach(e=>e.setAttribute('aria-label',txt(P('镧系离子结合位点概念示意','Conceptual lanthanide binding-site illustration'))));const ce=document.getElementById('chartElement');if(ce)ce.setAttribute('aria-label',txt(P('图表元素','Chart element')));}
function progress(){const total=document.documentElement.scrollHeight-innerHeight;document.getElementById('progress').style.width=(total?scrollY/total*100:0)+'%';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;let change=true;if(b.dataset.lang){S.lang=b.dataset.lang;setLang();return;}else if(b.dataset.depth!==undefined)S.depth=+b.dataset.depth;else if(b.dataset.step!==undefined)S.step=+b.dataset.step;else if(b.dataset.topo!==undefined)S.topo=+b.dataset.topo;else if(b.dataset.module!==undefined)S.module=+b.dataset.module;else if(b.dataset.map!==undefined)S.map=+b.dataset.map;else if(b.dataset.metric)S.metric=b.dataset.metric;else if(b.dataset.chartmat!==undefined)S.mat=+b.dataset.chartmat;else if(b.dataset.action==='prev')S.step=Math.max(0,S.step-1);else if(b.dataset.action==='next')S.step=Math.min(3,S.step+1);else if(b.dataset.action==='reset')S.step=0;else change=false;if(change){const selector=b.dataset.depth!==undefined?`[data-depth="${S.depth}"]`:b.dataset.action?`[data-action="${b.dataset.action}"]`:null;render();if(selector)document.querySelector(selector)?.focus({preventScroll:true});}});
document.addEventListener('change',e=>{if(e.target.id==='material'){S.mat=+e.target.value;render();}if(e.target.id==='element'||e.target.id==='chartElement'){S.ln=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='ce'){S.ce=+e.target.value;document.getElementById('masscalc').innerHTML=massCalc();}});addEventListener('scroll',progress,{passive:true});addEventListener('resize',progress);render();
</script></body></html>
